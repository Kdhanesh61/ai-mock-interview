```properties
# ===============================
# Application
# ===============================

spring.application.name=ai-mock-interview

server.port=8080


# ===============================
# MySQL Database
# ===============================

spring.datasource.url=jdbc:mysql://localhost:3306/ai_mock_interview

spring.datasource.username=root

spring.datasource.password=${DB_PASSWORD}


# ===============================
# JPA / Hibernate
# ===============================

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true

spring.jpa.properties.hibernate.format_sql=true


# ===============================
# Spring AI - Ollama
# ===============================

spring.ai.ollama.base-url=http://localhost:11434

spring.ai.ollama.chat.options.model=qwen3:4b-instruct

spring.ai.ollama.chat.options.temperature=0.7


# ===============================
# JWT
# ===============================

jwt.secret=${JWT_SECRET}


# ===============================
# Gmail SMTP
# ===============================

spring.mail.host=smtp.gmail.com

spring.mail.port=587

spring.mail.username=2100039061cse.r@gmail.com

spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true

spring.mail.properties.mail.smtp.starttls.enable=true

spring.mail.properties.mail.smtp.starttls.required=true


# ===============================
# OTP
# ===============================

app.otp.expiry-minutes=5
```
